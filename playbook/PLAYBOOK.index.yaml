editRoutes:
  - id: requirements-scope-change
    when: 요구사항/유저 플로우/범위 변경
    open:
      - design/design.md
      - design/architecture.md
    thenRead:
      - playbook/en/core/readability.md
      - playbook/en/core/code-style.md
  - id: api-contract-change
    when: API 스펙/에러 포맷/요청 응답 스키마 변경
    open:
      - design/api-spec.md
      - playbook/en/backend/spring.md
      - playbook/en/core/error-handling.md
    thenRead:
      - playbook/en/security.md
      - playbook/en/testing.md
  - id: data-model-change
    when: 엔터티/테이블/인덱스/관계 변경
    open:
      - design/erd.md
      - playbook/en/core/data-design.md
      - playbook/en/database/redis.md
    thenRead:
      - playbook/en/backend/spring.md
      - design/api-spec.md
  - id: frontend-ui-change
    when: 컴포넌트 구조/접근성/SVG 아이콘 변경
    open:
      - playbook/en/frontend/stacks/nextjs.md
      - playbook/en/frontend/ui/component.md
      - playbook/en/frontend/ui/accessibility.md
      - playbook/en/frontend/ui/svg-icon.md
    thenRead:
      - playbook/en/core/naming.md
      - playbook/en/core/code-style.md
  - id: frontend-style-theme-change
    when: Tailwind/CSS Module/테마 변경
    open:
      - playbook/en/frontend/stacks/nextjs.md
      - playbook/en/frontend/styling/tailwindcss.md
      - playbook/en/frontend/styling/css-module.md
      - playbook/en/frontend/styling/theme.md
    thenRead:
      - playbook/en/core/performance.md
  - id: frontend-data-fetch-change
    when: React Query 캐시/동기화/로딩 전략 변경
    open:
      - playbook/en/frontend/stacks/nextjs.md
      - playbook/en/frontend/data/react-query.md
    thenRead:
      - playbook/en/core/error-handling.md
      - playbook/en/security.md
      - playbook/en/testing.md
  - id: i18n-seo-change
    when: 번역 키/locale/SEO 메타데이터 변경
    open:
      - playbook/en/frontend/content/i18n.md
      - playbook/en/frontend/content/seo.md
      - playbook/en/security.md
      - playbook/en/testing.md
    thenRead:
      - playbook/en/core/naming.md
  - id: security-testing-policy-change
    when: 보안 정책/테스트 기준 변경
    open:
      - playbook/en/security.md
      - playbook/en/testing.md
    thenRead:
      - playbook/en/backend/spring.md
      - playbook/en/frontend/stacks/nextjs.md
  - id: infra-deployment-change
    when: 배포/인프라/런타임 설정 변경
    open:
      - design/architecture.md
      - playbook/en/infra/aws.md
    thenRead:
      - playbook/en/security.md
      - playbook/en/testing.md
